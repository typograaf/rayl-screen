<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- Cover, so the picture goes under the notch and the home indicator and
         the insets are ours to place things inside of. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#696963" />
    <title>Rayl</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23696963'/%3E%3Crect x='6' y='11' width='20' height='10' rx='3' fill='%23eaeae5'/%3E%3C/svg%3E"
    />
    <script type="module" crossorigin src="./assets/index-UhFmlI_c.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DGEHEhPI.css">
  </head>
  <body class="starting">
    <main class="screen">
      <header class="mark">
        <img class="glyph" src="./rayl-mark.svg" alt="Rayl" />
        <span class="word"
          ><b>Rayl</b><img class="reg" src="./rayl-reg.svg" alt=""
        /></span>
        <img class="bell" src="./bell.svg" alt="Meldingen" />
      </header>

      <section class="calendar">
        <!--
          Three rails with a tick above and below each of them, at the middle of
          the column — node 893:7501. The ticks are how the screen says where
          the choosing happens: two points wide, six tall, dead centre, and the
          thing under them is the thing that is chosen.
        -->
        <span class="tick"></span>
        <div class="rail months" id="months" aria-label="Maand"></div>
        <span class="tick"></span>
        <div class="rail days" id="days" aria-label="Dag"></div>
        <span class="tick"></span>
        <div class="rail distance" id="distance" aria-label="Afstand"></div>
        <span class="tick"></span>
      </section>

      <section class="cards">
        <canvas id="stage"></canvas>
        <!--
          The reel is what is actually scrolled: a native scroller with a stop
          for every card, laid over the picture and invisible. Everything a
          phone knows about scrolling — the rubber band, the momentum, the way a
          flick decays — is in there and cannot be written by hand.
        -->
        <div class="reel" id="reel"></div>
      </section>

      <nav class="tabs">
        <span class="rule"></span>
        <button type="button" class="tab"><span>Team</span></button>
        <span class="rule"></span>
        <button type="button" class="tab"><span>Kalender</span></button>
        <span class="rule"></span>
        <button type="button" class="tab"><span>Chat</span></button>
        <span class="rule"></span>
        <button type="button" class="tab"><span>Menu</span></button>
        <span class="rule"></span>
      </nav>
    </main>

  </body>
</html>
